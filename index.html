<!DOCTYPE html>
<html>
<head>
    <title>Pokemon PSA Scanner</title>
</head>
<body>

    <h1>Pokémon Card Pre-Grader</h1>
    <p>Scan gratis de voor- en achterkant van je kaart.</p>
    
    <video id="video" autoplay playsinline style="width: 100%; max-width: 400px; background: black;"></video>
    <canvas id="canvas" style="display: none;"></canvas>
    
    <br>
    <button id="snapFront">📷 Scan Voorkant</button>
    <button id="snapBack">📷 Scan Achterkant</button>
    <button id="analyzeBtn" style="display: none;">🔍 Zoek PSA Voorbeelden</button>

    <div id="result"></div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapFront = document.getElementById('snapFront');
    const snapBack = document.getElementById('snapBack');
    const analyzeBtn = document.getElementById('analyzeBtn');
    let frontImg = null;
    let backImg = null;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("Camera werkt niet."); });

    function capture(side) {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg');
        
        if (side === 'front') {
            frontImg = dataUrl;
            alert("Voorkant opgeslagen!");
        } else {
            backImg = dataUrl;
            alert("Achterkant opgeslagen!");
        }

        if (frontImg && backImg) {
            analyzeBtn.style.display = "inline";
        }
    }

    snapFront.addEventListener('click', () => capture('front'));
    snapBack.addEventListener('click', () => capture('back'));

    analyzeBtn.addEventListener('click', () => {
        const cardName = prompt("Welke Pokémon en kaartnummer heb je gescand? (Bijv: Charizard 4/102)");
        
        if (cardName) {
            document.getElementById('result').innerHTML = `
                <h3>🔍 Zoekopdracht gestart!</h3>
                <p>Vergelijk jouw kaart handmatig met echte verkochte PSA-kaarten:</p>
                <a href="https://ebay.com{encodeURIComponent(cardName)}+psa+graded&LH_Sold=1" target="_blank" style="color: blue; font-weight: bold; font-size: 18px;">➡️ Bekijk echte PSA kaarten op eBay</a>
            `;
            window.open(`https://ebay.com{encodeURIComponent(cardName)}+psa+graded&LH_Sold=1`, '_blank');
        } else {
            document.getElementById('result').innerText = "Typ een kaartnaam in om te kunnen zoeken.";
        }
    });
</script>

</body>
</html>
